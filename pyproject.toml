[project]
name = "pobj"
version = "0.1.0"
description = "Latent vs masked-residue pretraining for protein stability"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/test_protein_correctness.py belongs to the earlier Petnica project under
# gjepa/ and has its own dependencies.
addopts = "--ignore=tests/test_protein_correctness.py"
